<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#245b83">
<title>西暦・和暦変換／経過年数</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="西暦・和暦変換">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic UI","Meiryo",sans-serif;color:#1f2937;background:#f3f6f9}
*{box-sizing:border-box} body{margin:0;padding:20px 14px 36px}
main{max-width:760px;margin:auto}
h1{font-size:1.55rem;text-align:center;color:#17476b;margin:8px 0 5px}
.sub{text-align:center;color:#526273;margin:0 0 20px;font-size:.94rem}
.card{background:#fff;border:1px solid #d8e1e8;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #17324d0b}
h2{font-size:1.15rem;color:#17476b;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{flex:1 1 110px;min-width:90px}
label{display:block;font-size:.9rem;margin:0 0 6px;color:#465565}
input,select{width:100%;padding:12px 10px;border:1px solid #aebdca;border-radius:8px;font-size:1.13rem;background:white;color:#17212b}
button{border:0;border-radius:9px;padding:12px 18px;font-size:1rem;font-weight:600;background:#245b83;color:white;cursor:pointer;margin-top:14px}
button:active{opacity:.8}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{flex:1 1 135px}
button.secondary{background:#e6eef5;color:#17476b;border:1px solid #aec3d4}
button.copy{background:#386b55;flex:0 0 54px;width:54px;min-width:54px;display:inline-flex;justify-content:center;align-items:center;padding:12px}button.copy svg{display:block}button.copy:focus-visible{outline:3px solid #ffb83d;outline-offset:2px}
.today-banner{background:#dceefa;border:2px solid #4e8fbd;border-radius:12px;padding:15px;text-align:center;font-weight:700;font-size:1.18rem;color:#17476b;margin-bottom:18px;line-height:1.65}
.result{font-size:1.12rem}
@media(max-width:420px){.card{padding:15px}.field{flex:1 1 85px}h1{font-size:1.45rem}}
.result{margin-top:14px;padding:13px;background:#eef5fa;border-radius:9px;min-height:48px;line-height:1.7;overflow-wrap:anywhere}
.result strong{font-size:1.12rem;color:#17476b}
.error{color:#a12626;background:#fff0f0}
.note{font-size:.85rem;color:#596979;line-height:1.6}
.footer{text-align:center;font-size:.8rem;color:#718096;margin-top:20px}
@media(min-width:600px){body{padding-top:30px}.card{padding:22px}}
/* Windowsのマウス操作用数字パッド。タッチ端末では標準キーボードを使う */
.year-field{position:relative}
#keypadBackdrop{position:fixed;inset:0;background:#0005;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
#keypadBackdrop.visible{display:flex}
#keypad{width:min(310px,100%);background:white;border-radius:14px;padding:16px;box-shadow:0 12px 40px #0004}
#keypadTitle{font-weight:700;color:#17476b;margin-bottom:8px}
#keypadDisplay{font-size:1.7rem;text-align:right;padding:10px;border:1px solid #b5c8d8;border-radius:8px;min-height:55px;margin-bottom:10px}
.keygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keygrid button{margin:0;padding:14px 4px;font-size:1.25rem;background:#e6eef5;color:#17476b}
.keygrid button:focus-visible{outline:3px solid #1b76b9}
.keypad-footer{display:flex;gap:8px;margin-top:8px}
.keypad-footer button{flex:1;margin:0}

</style>
</head>
<body>
<main>
<h1>西暦・和暦変換</h1>
<p class="sub">年月日の相互変換と経過年数の自動計算</p>

<div class="today-banner" id="todayBanner" aria-live="polite"></div>
<section class="card">
<h2>① 西暦から和暦へ</h2>
<div class="row">
 <div class="field"><label for="gy">西暦（年）</label><input id="gy" type="number" inputmode="numeric" min="1868" max="9999" placeholder="例：1943"></div>
 <div class="field"><label for="gm">月</label><select id="gm"><option value="">選択</option></select></div>
 <div class="field"><label for="gd">日</label><select id="gd"><option value="">選択</option></select></div>
</div>
<div class="actions"><button type="button" onclick="fromGregorian()">変換</button><button class="secondary" type="button" onclick="clearInputs('g')">クリア</button><button class="copy" type="button" onclick="copyResult('gResult')" title="コピー" aria-label="変換結果をコピー"><svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>
<div id="gResult" class="result" aria-live="polite">変換結果がここに表示されます。</div>
</section>

<section class="card">
<h2>② 和暦から西暦へ</h2>
<div class="row">
 <div class="field"><label for="era">元号</label><select id="era"><option value="令和">令和</option><option value="平成">平成</option><option value="昭和">昭和</option><option value="大正">大正</option><option value="明治">明治</option></select></div>
 <div class="field"><label for="ey">年（元年は1）</label><input id="ey" type="number" inputmode="numeric" min="1" max="9999" placeholder="例：18"></div>
 <div class="field"><label for="em">月</label><select id="em"><option value="">選択</option></select></div>
 <div class="field"><label for="ed">日</label><select id="ed"><option value="">選択</option></select></div>
</div>
<div class="actions"><button type="button" onclick="toGregorian()">変換</button><button class="secondary" type="button" onclick="clearInputs('e')">クリア</button><button class="copy" type="button" onclick="copyResult('eResult')" title="コピー" aria-label="変換結果をコピー"><svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>
<div id="eResult" class="result" aria-live="polite">変換結果がここに表示されます。</div>
</section>


<p class="note">対応元号：明治・大正・昭和・平成・令和。元号の開始日・終了日を日単位で判定します。日付の計算はこの端末内で行い、入力内容を外部へ送信しません。</p>
<div class="footer">オフライン用・試作版</div>
</main>
<div id="keypadBackdrop" role="dialog" aria-modal="true" aria-labelledby="keypadTitle" onclick="if(event.target===this)closeKeypad()">
 <div id="keypad">
  <div id="keypadTitle">年の数字入力</div>
  <div id="keypadDisplay" aria-live="polite"></div>
  <div class="keygrid" id="keygrid"></div>
  <div class="keypad-footer"><button type="button" class="secondary" onclick="closeKeypad()">閉じる</button><button type="button" onclick="closeKeypad()">決定</button></div>
 </div>
</div>
<script>
let keypadTarget=null;
function openKeypad(id){
 keypadTarget=document.getElementById(id);
 document.getElementById('keypadTitle').textContent=(id==='gy'?'西暦':'和暦')+'（年）の数字入力';
 document.getElementById('keypadBackdrop').classList.add('visible');
 updateKeypadDisplay();
 document.querySelector('#keygrid button').focus();
}
function updateKeypadDisplay(){document.getElementById('keypadDisplay').textContent=keypadTarget?.value||'年を入力';}
function keypadPress(key){
 if(!keypadTarget)return;
 let v=keypadTarget.value;
 if(key==='C')v='';else if(key==='←')v=v.slice(0,-1);else if(v.length<4)v+=key;
 keypadTarget.value=v;
 keypadTarget.dispatchEvent(new Event('input',{bubbles:true}));
 updateKeypadDisplay();
}
function closeKeypad(){document.getElementById('keypadBackdrop').classList.remove('visible');keypadTarget=null;}
for(const key of ['1','2','3','4','5','6','7','8','9','C','0','←']){
 const b=document.createElement('button');b.type='button';b.textContent=key;b.addEventListener('click',()=>keypadPress(key));document.getElementById('keygrid').appendChild(b);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&keypadTarget)closeKeypad()});
// マウス・トラックパッド利用時は年の入力欄をクリックするだけで表示。
// タッチ端末では標準の数字キーボードを利用する。
for(const id of ['gy','ey']){
 const input=document.getElementById(id);
 input.addEventListener('click',event=>{
  if(event.detail>0 && window.matchMedia('(pointer:fine)').matches && !keypadTarget){
   openKeypad(id);
  }
 });
}
const eras = [
 {name:"明治", start:"1868-01-25", end:"1912-07-29", startYear:1868},
 {name:"大正", start:"1912-07-30", end:"1926-12-24", startYear:1912},
 {name:"昭和", start:"1926-12-25", end:"1989-01-07", startYear:1926},
 {name:"平成", start:"1989-01-08", end:"2019-04-30", startYear:1989},
 {name:"令和", start:"2019-05-01", end:"9999-12-31", startYear:2019}
];
function fillMonths(prefix){
 const sel=document.getElementById(prefix+'m');
 for(let m=1;m<=12;m++)sel.add(new Option(m+'月',String(m)));
}
function updateDays(prefix){
 const y=Number(document.getElementById(prefix+'y').value);
 const m=Number(document.getElementById(prefix+'m').value);
 const old=document.getElementById(prefix+'d').value;
 const sel=document.getElementById(prefix+'d');
 sel.replaceChildren(new Option('選択',''));
 if(!Number.isInteger(y)||y<1||!m)return;
 const westernYear=prefix==='e'?eras.find(e=>e.name===document.getElementById('era').value).startYear+y-1:y;
 if(westernYear<1||westernYear>9999)return;
 const last=new Date(2000,m,1);
 last.setFullYear(westernYear);
 last.setDate(0);
 const count=last.getDate();
 for(let d=1;d<=count;d++)sel.add(new Option(d+'日',String(d)));
 if(Number(old)>=1&&Number(old)<=count)sel.value=old;
}
function refreshToday(){
 const d=new Date();
 document.getElementById('todayBanner').textContent='今日：'+dateText(d)+'（'+(eraText(d)||'和暦対象外')+'）';
}
for(const prefix of ['g','e']){
 fillMonths(prefix);
 for(const id of [prefix+'y',prefix+'m',...(prefix==='e'?['era']:[])])
  document.getElementById(id).addEventListener('change',()=>updateDays(prefix));
 document.getElementById(prefix+'y').addEventListener('input',()=>updateDays(prefix));
 document.getElementById(prefix+'m').addEventListener('input',()=>updateDays(prefix));
}
refreshToday();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday()});
window.addEventListener('focus',refreshToday);
function clearInputs(prefix){
 for(const part of ['y','m','d'])document.getElementById(prefix+part).value='';
 updateDays(prefix);
 if(prefix==='e')document.getElementById('era').value='令和';
 const id=prefix==='e'?'eResult':'gResult';
 show(id,'変換結果がここに表示されます。');
}
async function copyResult(id){
 const el=document.getElementById(id);
 if(el.classList.contains('error')||el.textContent.includes('ここに表示')){alert('先に変換してください。');return;}
 const value=el.innerText;
 try{
   if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);
   else{
     const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
     const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed');
   }
   alert('変換結果をコピーしました。');
 }catch(e){alert('この環境ではコピーできませんでした。結果を長押しして選択してください。');}
}
function pad(n){return String(n).padStart(2,"0")}
function makeDate(y,m,d){
 if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)||y<1||y>9999||m<1||m>12||d<1||d>31) return null;
 const dt=new Date(2000,m-1,d);dt.setFullYear(y);
 if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return null;
 return dt;
}
function iso(dt){return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
function dateText(dt){return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`}
function eraFor(dt){const s=iso(dt);return eras.find(e=>s>=e.start&&s<=e.end)}
function eraText(dt){
 const e=eraFor(dt); if(!e)return null;
 const n=dt.getFullYear()-e.startYear+1;
 return `${e.name}${n===1?"元":n}年${dt.getMonth()+1}月${dt.getDate()}日`;
}
function show(id,msg,bad=false){const el=document.getElementById(id);el.className="result"+(bad?" error":"");el.innerHTML=msg}
function readDate(prefix){
 const y=Number(document.getElementById(prefix+"y").value),m=Number(document.getElementById(prefix+"m").value),d=Number(document.getElementById(prefix+"d").value);
 if(!document.getElementById(prefix+"y").value||!document.getElementById(prefix+"m").value||!document.getElementById(prefix+"d").value)return {error:"年・月・日をすべて入力してください。"};
 const dt=makeDate(y,m,d);return dt?{dt}:{error:"実在する日付を入力してください。"};
}
function durationText(dt){
 const today=new Date();today.setHours(0,0,0,0);
 let start=dt,end=today,heading="経過年数";
 if(start>today){start=today;end=dt;heading="残り期間";}
 let years=end.getFullYear()-start.getFullYear();
 let cursor=addMonthsClamped(start,years*12);
 if(cursor>end){years--;cursor=addMonthsClamped(start,years*12)}
 let months=(end.getFullYear()-cursor.getFullYear())*12+(end.getMonth()-cursor.getMonth());
 let cursor2=addMonthsClamped(cursor,months);
 if(cursor2>end){months--;cursor2=addMonthsClamped(cursor,months)}
 const days=Math.round((end-cursor2)/86400000);
 return `<div style="margin-top:9px;border-top:1px solid #c9dce8;padding-top:9px">${heading}<br><strong>満${years}年</strong><br>${years}年${months}か月${days}日</div>`;
}
function fromGregorian(){
 const r=readDate("g");if(r.error)return show("gResult",r.error,true);
 const w=eraText(r.dt);if(!w)return show("gResult","明治元年の開始日（1868年1月25日）以降の日付を入力してください。",true);
 show("gResult",`<strong>${w}</strong>${durationText(r.dt)}`);
}
function toGregorian(){
 const name=document.getElementById("era").value;
 const y=Number(document.getElementById("ey").value),m=Number(document.getElementById("em").value),d=Number(document.getElementById("ed").value);
 if(!document.getElementById("ey").value||!document.getElementById("em").value||!document.getElementById("ed").value)return show("eResult","年・月・日をすべて入力してください。",true);
 if(!Number.isInteger(y)||y<1)return show("eResult","年は1以上の整数を入力してください。",true);
 const e=eras.find(x=>x.name===name),dt=makeDate(e.startYear+y-1,m,d);
 if(!dt)return show("eResult","実在する日付を入力してください。",true);
 if(iso(dt)<e.start||iso(dt)>e.end)return show("eResult",`${name}${y===1?"元":y}年の日付としては範囲外です。元号の開始日・終了日を確認してください。`,true);
 show("eResult",`<strong>${dateText(dt)}</strong>${durationText(dt)}`);
}
function addMonthsClamped(date,months){
 const y=date.getFullYear(),m=date.getMonth()+months,d=date.getDate();
 const first=new Date(y,m,1),last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
 return new Date(first.getFullYear(),first.getMonth(),Math.min(d,last));
}

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('オフライン登録に失敗:', err));
  });
}
</script>
</body>
</html>
